# The conceptual fabric model: something FPGA-like, with abstract
# knobs, refinable later.
#
# Nothing here imports gowin-profile. That is deliberate -- a model
# that could reach for LUT4 counts would drift back toward the fit
# modelling this project has decided not to do yet.

[workspace]
members = [
    "crates/fabric-model",
    "crates/fabric-report",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = "warn"
