# Sequential parameter access. The WeightStream trait's surface is a
# restriction, not a capability: there is no seek to call, so an engine
# written against it cannot erode back into a memory controller.
# See docs/plan.md section 3.

[workspace]
members = [
    "crates/spm-stream",
    "crates/spm-stream-mem",
    "crates/spm-stream-file",
    "crates/spm-stream-groups",
    "crates/spm-stream-metrics",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = "warn"
