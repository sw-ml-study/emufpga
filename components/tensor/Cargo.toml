# The CPU golden reference engine. This is the oracle the saga 2
# fabric simulator and the saga 6 RTL are both checked against, so its
# correctness matters more than its speed.

[workspace]
members = [
    "crates/spm-accum",
    "crates/spm-hrm",
    "crates/spm-linear",
    "crates/spm-numeric",
    "crates/spm-ops",
    "crates/spm-activations",
    "crates/spm-gemv-ref",
    "crates/spm-trm",
    "crates/spm-trm-resident",
    "crates/spm-vectors",
    "crates/spm-vectors-text",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.lints.clippy]
pedantic = "warn"
